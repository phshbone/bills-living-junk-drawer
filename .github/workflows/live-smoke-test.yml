name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Code.gs'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/live-smoke-test.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUNK_DRAWER_URL: ${{ vars.JUNK_DRAWER_URL || 'https://phshbone.github.io/bills-living-junk-drawer/' }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      JUNK_DRAWER_TOKEN: ${{ secrets.JUNK_DRAWER_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow GitHub Pages deployment to settle
        run: sleep 20

      - name: Run live Playwright smoke test
        run: npm run smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces, screenshots, and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
